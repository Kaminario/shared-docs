<svg xmlns="http://www.w3.org/2000/svg" width="900" height="445" viewBox="0 0 900 445" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect x="0" y="0" width="900" height="445" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2933">Steps 6–8: replace prod-vol1 with its full clone</text>

  <!-- BEFORE -->
  <text x="160" y="58" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2933">Before</text>
  <rect x="20" y="68" width="280" height="118" rx="10" fill="#eef4fb" stroke="#4a7bb7" stroke-width="2"/>
  <text x="32" y="86" font-weight="bold" fill="#2c4f7c">prod-vg</text>
  <rect x="35" y="94" width="250" height="26" rx="5" fill="#ffffff" stroke="#c62828" stroke-width="2"/>
  <text x="160" y="112" text-anchor="middle" font-weight="bold" fill="#1f2933">prod-vol1  (original)</text>
  <rect x="35" y="124" width="250" height="26" rx="5" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="160" y="142" text-anchor="middle" fill="#52606d">prod-vol2</text>
  <rect x="35" y="154" width="250" height="26" rx="5" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="160" y="172" text-anchor="middle" fill="#52606d">prod-vol3</text>

  <rect x="20" y="196" width="280" height="150" rx="10" fill="#eef8f0" stroke="#3f8f55" stroke-width="2"/>
  <text x="32" y="214" font-weight="bold" fill="#2d6a3e">prod-clones-vg</text>
  <rect x="35" y="222" width="250" height="26" rx="5" fill="#ffffff" stroke="#c62828" stroke-dasharray="4,3"/>
  <text x="160" y="240" text-anchor="middle" fill="#1f2933">prod-vol1-tc  (thin clone of prod-vol1)</text>
  <rect x="35" y="252" width="250" height="26" rx="5" fill="#ffffff" stroke="#4a7bb7" stroke-width="2"/>
  <text x="160" y="270" text-anchor="middle" font-weight="bold" fill="#1f2933">prod-vol1-fc  (full clone)</text>
  <rect x="35" y="282" width="250" height="26" rx="5" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="160" y="300" text-anchor="middle" fill="#52606d">prod-vol2-tc</text>
  <rect x="35" y="312" width="250" height="26" rx="5" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="160" y="330" text-anchor="middle" fill="#52606d">prod-vol3-tc</text>

  <rect x="20" y="356" width="280" height="60" rx="10" fill="#f7f7f7" stroke="#7b8794" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="32" y="374" font-weight="bold" fill="#52606d">prod-bkp-vg</text>
  <text x="160" y="400" text-anchor="middle" font-size="12" fill="#9aa5b1">(empty)</text>

  <!-- STEPS -->
  <text x="450" y="58" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2933">Actions, in this order</text>
  <rect x="320" y="68" width="260" height="50" rx="6" fill="#fdecea" stroke="#c62828"/>
  <text x="332" y="88" font-weight="bold" fill="#1f2933">1. DELETE prod-vol1-tc</text>
  <text x="332" y="106" font-size="11" fill="#52606d">only after the full clone copy is done</text>
  <rect x="320" y="126" width="260" height="50" rx="6" fill="#f5f7fa" stroke="#7b8794"/>
  <text x="332" y="146" font-weight="bold" fill="#1f2933">2. PATCH prod-vol1</text>
  <text x="332" y="164" font-size="11" fill="#52606d">volume_group → prod-bkp-vg</text>
  <rect x="320" y="184" width="260" height="50" rx="6" fill="#f5f7fa" stroke="#7b8794"/>
  <text x="332" y="204" font-weight="bold" fill="#1f2933">3. PATCH prod-vol1</text>
  <text x="332" y="222" font-size="11" fill="#52606d">name → prod-vol1-orig  (frees the name)</text>
  <rect x="320" y="242" width="260" height="50" rx="6" fill="#f5f7fa" stroke="#7b8794"/>
  <text x="332" y="262" font-weight="bold" fill="#1f2933">4. PATCH prod-vol1-fc</text>
  <text x="332" y="280" font-size="11" fill="#52606d">volume_group → prod-vg</text>
  <rect x="320" y="300" width="260" height="50" rx="6" fill="#f5f7fa" stroke="#7b8794"/>
  <text x="332" y="320" font-weight="bold" fill="#1f2933">5. PATCH prod-vol1-fc</text>
  <text x="332" y="338" font-size="11" fill="#52606d">name → prod-vol1</text>
  <text x="450" y="378" text-anchor="middle" font-size="12" fill="#c62828">1 before 2: a thin clone origin cannot move</text>
  <text x="450" y="398" text-anchor="middle" font-size="12" fill="#c62828">3 before 5: volume names are unique</text>

  <!-- AFTER -->
  <text x="740" y="58" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2933">After</text>
  <rect x="600" y="68" width="280" height="118" rx="10" fill="#eef4fb" stroke="#4a7bb7" stroke-width="2"/>
  <text x="612" y="86" font-weight="bold" fill="#2c4f7c">prod-vg</text>
  <rect x="615" y="94" width="250" height="26" rx="5" fill="#ffffff" stroke="#3f8f55" stroke-width="2"/>
  <text x="740" y="112" text-anchor="middle" font-weight="bold" fill="#1f2933">prod-vol1  (was prod-vol1-fc)</text>
  <rect x="615" y="124" width="250" height="26" rx="5" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="740" y="142" text-anchor="middle" fill="#52606d">prod-vol2</text>
  <rect x="615" y="154" width="250" height="26" rx="5" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="740" y="172" text-anchor="middle" fill="#52606d">prod-vol3</text>

  <rect x="600" y="196" width="280" height="90" rx="10" fill="#eef8f0" stroke="#3f8f55" stroke-width="2"/>
  <text x="612" y="214" font-weight="bold" fill="#2d6a3e">prod-clones-vg</text>
  <rect x="615" y="222" width="250" height="26" rx="5" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="740" y="240" text-anchor="middle" fill="#52606d">prod-vol2-tc</text>
  <rect x="615" y="252" width="250" height="26" rx="5" fill="#ffffff" stroke="#9aa5b1"/>
  <text x="740" y="270" text-anchor="middle" fill="#52606d">prod-vol3-tc</text>

  <rect x="600" y="356" width="280" height="60" rx="10" fill="#f7f7f7" stroke="#7b8794" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="612" y="374" font-weight="bold" fill="#52606d">prod-bkp-vg</text>
  <rect x="615" y="382" width="250" height="26" rx="5" fill="#ffffff" stroke="#c62828" stroke-width="2"/>
  <text x="740" y="400" text-anchor="middle" font-weight="bold" fill="#1f2933">prod-vol1-orig  (original)</text>
</svg>
