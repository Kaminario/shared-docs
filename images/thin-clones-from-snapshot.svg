<svg xmlns="http://www.w3.org/2000/svg" width="900" height="345" viewBox="0 0 900 345" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b4a5a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="345" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2933">Step 3: one snapshot, three thin clones</text>

  <!-- prod-vg -->
  <rect x="20" y="55" width="330" height="220" rx="10" fill="#eef4fb" stroke="#4a7bb7" stroke-width="2"/>
  <text x="35" y="77" font-weight="bold" fill="#2c4f7c">prod-vg</text>
  <rect x="40" y="112" width="120" height="36" rx="6" fill="#ffffff" stroke="#4a7bb7"/>
  <text x="100" y="135" text-anchor="middle" fill="#1f2933">prod-vol1</text>
  <rect x="40" y="152" width="120" height="36" rx="6" fill="#ffffff" stroke="#4a7bb7"/>
  <text x="100" y="175" text-anchor="middle" fill="#1f2933">prod-vol2</text>
  <rect x="40" y="192" width="120" height="36" rx="6" fill="#ffffff" stroke="#4a7bb7"/>
  <text x="100" y="215" text-anchor="middle" fill="#1f2933">prod-vol3</text>

  <!-- snapshot -->
  <rect x="180" y="86" width="150" height="152" rx="6" fill="#fff8e1" stroke="#d4a017" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="255" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5c00">snapshot prod-snap1</text>
  <rect x="192" y="114" width="126" height="32" rx="4" fill="#ffe8a3" stroke="#d4a017"/>
  <text x="255" y="135" text-anchor="middle" font-size="12" fill="#1f2933">part of prod-vol1</text>
  <rect x="192" y="154" width="126" height="32" rx="4" fill="#ffe8a3" stroke="#d4a017"/>
  <text x="255" y="175" text-anchor="middle" font-size="12" fill="#1f2933">part of prod-vol2</text>
  <rect x="192" y="194" width="126" height="32" rx="4" fill="#ffe8a3" stroke="#d4a017"/>
  <text x="255" y="215" text-anchor="middle" font-size="12" fill="#1f2933">part of prod-vol3</text>

  <line x1="160" y1="130" x2="190" y2="130" stroke="#3b4a5a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="160" y1="170" x2="190" y2="170" stroke="#3b4a5a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="160" y1="210" x2="190" y2="210" stroke="#3b4a5a" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- clones vg -->
  <rect x="560" y="55" width="320" height="220" rx="10" fill="#eef8f0" stroke="#3f8f55" stroke-width="2"/>
  <text x="575" y="77" font-weight="bold" fill="#2d6a3e">prod-clones-vg</text>
  <rect x="600" y="112" width="240" height="36" rx="6" fill="#ffffff" stroke="#3f8f55" stroke-width="1.5"/>
  <text x="720" y="127" text-anchor="middle" font-weight="bold" fill="#1f2933">prod-vol1-tc</text>
  <text x="720" y="142" text-anchor="middle" font-size="11" fill="#52606d">source_snap = part of prod-vol1</text>
  <rect x="600" y="152" width="240" height="36" rx="6" fill="#ffffff" stroke="#3f8f55" stroke-width="1.5"/>
  <text x="720" y="167" text-anchor="middle" font-weight="bold" fill="#1f2933">prod-vol2-tc</text>
  <text x="720" y="182" text-anchor="middle" font-size="11" fill="#52606d">source_snap = part of prod-vol2</text>
  <rect x="600" y="192" width="240" height="36" rx="6" fill="#ffffff" stroke="#3f8f55" stroke-width="1.5"/>
  <text x="720" y="207" text-anchor="middle" font-weight="bold" fill="#1f2933">prod-vol3-tc</text>
  <text x="720" y="222" text-anchor="middle" font-size="11" fill="#52606d">source_snap = part of prod-vol3</text>

  <line x1="318" y1="130" x2="598" y2="130" stroke="#3b4a5a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="318" y1="170" x2="598" y2="170" stroke="#3b4a5a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="318" y1="210" x2="598" y2="210" stroke="#3b4a5a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="445" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#3b4a5a">3 x POST /volumes</text>
  <text x="445" y="96" text-anchor="middle" font-size="11" fill="#3b4a5a">is_thin_clone, source_volume,</text>
  <text x="445" y="110" text-anchor="middle" font-size="11" fill="#3b4a5a">source_snapshot, volume_group</text>

  <rect x="20" y="290" width="860" height="42" rx="8" fill="#f5f7fa" stroke="#cbd2d9"/>
  <text x="35" y="316" fill="#1f2933">One request per volume (no bulk call). All 3 use the same source_snapshot, so the clones are from the same point in time.</text>
</svg>
